<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff0d4">
<title>رنة | تتبّع طلبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dff0d4;
    --card: #ffffff;
    --box: #f5f6f4;
    --ink: #161616;
    --muted: #8b8f88;
    --line: #d4d8d0;
    --green: #3fb765;
    --green-soft: #e3f4d9;
    --yellow: #f6b81a;
    --yellow-soft: #fff3cc;
    --idle: #e6e8e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%;
    max-width: 400px;
    min-height: min(720px, 100%);
    background: var(--card);
    border-radius: 32px;
    padding: 26px 22px 22px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 50px rgba(60, 100, 50, .18);
  }

  /* Header */
  .header { display: flex; align-items: center; gap: 12px; }
  .header { gap: 14px; }
  .brand-mark { height: 48px; width: auto; flex: none; display: block; }
  .restaurant {
    font-family: 'Reem Kufi', 'Tajawal', sans-serif;
    font-size: 36px; font-weight: 700; line-height: 1; color: #202a3a;
    padding-top: 4px;
  }
  .entry-logo { height: 112px; width: auto; align-self: center; margin-bottom: 4px; }

  /* Rating sheet */
  .rate {
    position: absolute; inset: 0; z-index: 6; background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 28px 24px; text-align: center;
    animation: sheetIn .4s ease both;
  }
  .rate[hidden] { display: none; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .rate-mark { height: 64px; width: auto; margin-bottom: 4px; }
  .rate h2 { font-size: 24px; font-weight: 800; }
  .rate p { color: var(--muted); font-size: 15px; }
  .stars { display: flex; gap: 4px; direction: rtl; margin: 12px 0 2px; }
  .star { background: none; border: 0; cursor: pointer; padding: 4px; line-height: 0; transition: transform .15s; }
  .star svg { width: 46px; height: 46px; fill: #e4e6e1; stroke: #e4e6e1; stroke-width: 1.5; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
  .star.on svg { fill: var(--yellow); stroke: var(--yellow); }
  .star:active { transform: scale(.88); }
  .star:focus-visible { outline: 3px solid var(--ink); border-radius: 12px; }
  .rate-hint { min-height: 24px; font-weight: 800; font-size: 18px; color: var(--ink); }
  .rate-skip { background: none; border: 0; color: var(--muted); font-family: inherit; font-size: 15px; cursor: pointer; padding: 10px; text-decoration: underline; }
  .rate-skip[hidden] { display: none; }

  /* Order number */
  .order-box {
    margin-top: 26px;
    background: var(--box);
    border-radius: 24px;
    padding: 24px 16px 20px;
    text-align: center;
  }
  .order-label { font-size: 16px; color: var(--muted); font-weight: 500; }
  .order-number {
    font-size: 104px; line-height: 1.05; font-weight: 800;
    color: #1d1d1d; margin-top: 6px;
    font-variant-numeric: tabular-nums;
    font-family: 'Tajawal', Arial, sans-serif;
    direction: ltr;
  }

  /* Steps */
  .steps {
    margin-top: 34px;
    display: flex; align-items: flex-start; justify-content: space-between;
    position: relative;
  }
  .step { flex: 1; text-align: center; position: relative; z-index: 1; }
  .dot {
    width: 44px; height: 44px; border-radius: 50%;
    margin: 0 auto;
    display: grid; place-items: center;
    background: var(--idle); color: #a3a8a0;
    font-size: 18px; font-weight: 700;
    transition: background .4s, color .4s, transform .4s;
  }
  .dot svg { width: 22px; height: 22px; display: none; }
  .step-name { margin-top: 10px; font-size: 14px; font-weight: 500; color: var(--muted); transition: color .3s; }

  .step.done .dot { background: var(--green); color: #fff; }
  .step.done .dot span { display: none; }
  .step.done .dot svg { display: block; }
  .step.done .step-name { color: var(--ink); }

  .step.current .dot {
    background: var(--yellow); color: #fff;
    animation: pulse 1.8s ease-out infinite;
  }
  .step.current .step-name { color: var(--ink); font-weight: 700; }

  /* dotted connectors (RTL: first step on the right) */
  .link {
    position: absolute; top: 21px; height: 0;
    border-top: 2.5px dotted var(--line);
    z-index: 0; transition: border-color .4s;
  }
  .link.l1 { right: calc(16.66% + 30px); width: calc(33.33% - 60px); }
  .link.l2 { right: calc(50% + 30px); width: calc(33.33% - 60px); }
  .link.on { border-top-color: var(--green); }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(246, 184, 26, .55); }
    70%  { box-shadow: 0 0 0 14px rgba(246, 184, 26, 0); }
    100% { box-shadow: 0 0 0 0 rgba(246, 184, 26, 0); }
  }
  .step.ready .dot { animation: ring 0.9s ease-in-out infinite; }
  @keyframes ring {
    0%, 100% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-14deg) scale(1.12); }
    40% { transform: rotate(12deg) scale(1.12); }
    60% { transform: rotate(-8deg) scale(1.08); }
    80% { transform: rotate(6deg) scale(1.04); }
  }

  .eta {
    margin-top: 26px; text-align: center;
    font-size: 16px; color: var(--muted); font-weight: 500;
  }
  .eta.ready { color: var(--green); font-weight: 800; font-size: 19px; }

  .spacer { flex: 1; min-height: 24px; }

  /* Button */
  .btn {
    width: 100%; border: 0; cursor: pointer;
    background: #000; color: #fff;
    border-radius: 22px; padding: 20px 18px;
    font-family: inherit; font-size: 19px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    transition: transform .12s, background .3s;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  .bell-chip {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--green-soft);
    display: grid; place-items: center; flex: none;
  }
  .bell-chip svg { width: 18px; height: 18px; }
  .btn.enabled { background: #1d3d27; }
  .btn.stop { background: var(--green); animation: ring 0.9s ease-in-out infinite; }
  .btn.stop .bell-chip { background: #fff; }

  .conn { text-align: center; margin-top: 12px; font-size: 12px; color: #b3b7b0; min-height: 16px; }
  .conn.ok { color: var(--green); }

  .card { position: relative; overflow: hidden; }
  .entry {
    position: absolute; inset: 0; z-index: 5; background: var(--card);
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: 28px 24px;
  }
  .entry[hidden] { display: none; }
  .entry h2 { font-size: 22px; font-weight: 800; }
  .entry p { color: var(--muted); font-size: 15px; }
  .entry input {
    width: 100%; border: 2px solid var(--line); border-radius: 20px; background: var(--box);
    font-family: inherit; font-size: 44px; font-weight: 800; text-align: center; padding: 14px; direction: ltr;
  }
  .btn-alt {
    background: none; border: 2px solid var(--line); color: var(--ink); border-radius: 20px;
    padding: 14px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .entry-msg { color: #c0392b; font-size: 14px; min-height: 18px; text-align: center; }
  .entry input:focus { outline: none; border-color: var(--green); }

  @media (prefers-reduced-motion: reduce) {
    .step.current .dot, .step.ready .dot, .btn.stop { animation: none; }
  }
  @media (max-width: 420px) {
    body { padding: 0; align-items: stretch; }
    .card { max-width: none; border-radius: 0; min-height: 100%; }
  }

  /* ===== Mobile sizing: not too big, not too small ===== */
  .restaurant { font-size: clamp(28px, 8.5vw, 36px); }
  .brand-mark { height: clamp(40px, 12vw, 48px); }
  .order-box { margin-top: clamp(18px, 4vh, 26px); padding: clamp(18px, 3.5vh, 24px) 16px clamp(16px, 3vh, 20px); }
  .order-number { font-size: clamp(76px, 26vw, 104px); }
  .steps { margin-top: clamp(24px, 4.5vh, 34px); }
  .step-name { font-size: clamp(13.5px, 3.8vw, 15px); }
  .eta { margin-top: clamp(18px, 3.5vh, 26px); font-size: clamp(15px, 4.3vw, 16.5px); }
  .eta.ready { font-size: clamp(17px, 5vw, 19px); }
  .btn { padding: clamp(16px, 2.6vh, 20px) 18px; font-size: clamp(17px, 5vw, 19px); }
  .entry h2 { font-size: clamp(20px, 6vw, 24px); }
  .entry p { font-size: clamp(14px, 4vw, 15.5px); }
  .entry input { font-size: clamp(34px, 11vw, 44px); }
  .entry-logo { height: clamp(84px, 24vw, 112px); }
  @media (max-width: 420px) {
    .card { min-height: 100vh; min-height: 100dvh;
            padding: calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
  }
  @media (max-height: 640px) {
    .order-number { font-size: clamp(60px, 20vw, 84px); }
    .eta { margin-top: 14px; }
  }

  /* ===== Text motion: words rise in as they enter the screen (scrolling down or up) ===== */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .js .tx .w {
    display: inline-block; opacity: 0; transform: translateY(.7em) scale(.96); filter: blur(5px);
    transition: opacity .6s ease, transform .75s cubic-bezier(.2,.8,.2,1), filter .6s ease;
    transition-delay: calc(var(--i, 0) * 70ms);
  }
  .js .tx.in .w { opacity: 1; transform: none; filter: none; }
  .js .rvb {
    opacity: 0; transform: translateY(28px);
    transition: opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .js .rvb.above { transform: translateY(-28px); }
  .js .rvb.in { opacity: 1; transform: none; transition-delay: var(--d, 0s); }
  .order-number { cursor: pointer; -webkit-user-select: none; user-select: none; }
  .order-number.pop  { animation: numpop .65s cubic-bezier(.2,.9,.3,1.25); }
  .order-number.bump { animation: numbump .45s ease; }
  @keyframes numpop  { 0% { transform: scale(.6); opacity: 0; filter: blur(8px); } 100% { transform: none; opacity: 1; filter: none; } }
  @keyframes numbump { 40% { transform: scale(1.08) rotate(-2deg); } 70% { transform: scale(.97) rotate(1deg); } }
  @media (prefers-reduced-motion: reduce) {
    .js .tx .w, .js .rvb { opacity: 1; transform: none; filter: none; transition: none; }
    .order-number.pop, .order-number.bump { animation: none; }
  }
</style>
<script>document.documentElement.className += ' js';</script>

<script>
  function loadFallback() {
    var s = document.createElement('script');
    s.src = location.protocol === 'file:' ? 'http://localhost:3000/socket.io/socket.io.js' : 'https://cdn.socket.io/4.7.5/socket.io.min.js';
    s.onload = function () { if (window.initSocket) window.initSocket(); };
    document.head.appendChild(s);
  }
</script>
<script src="/socket.io/socket.io.js" onerror="loadFallback()"></script>
<script>
(function () {
  var SERVER_URL = location.protocol === 'file:' ? 'http://localhost:3000' : location.origin;

  // Optional URL params: index.html?order=27&name=مطعم%20أبو%20علي&eta=5
  var params = new URLSearchParams(location.search);
  var orderId = '', sock = null;
  if (params.get('name')) document.getElementById('restaurantName').textContent = params.get('name');
  if (params.get('eta')) document.getElementById('eta').textContent = 'جاهز تقريباً خلال ' + params.get('eta') + ' دقائق';

  var $ = function (id) { return document.getElementById(id); };

  function normDigits(v) {
    return String(v).replace(/[\u0660-\u0669]/g, function (d) { return d.charCodeAt(0) - 0x0660; })
                    .replace(/[\u06F0-\u06F9]/g, function (d) { return d.charCodeAt(0) - 0x06F0; }).trim();
  }

  function applyOrder(id) {
    orderId = normDigits(id);
    $('orderNumber').textContent = orderId;
    $('entry' + 'Form').hidden = true;
    if (sock && sock.connected) sock.emit('join-order', orderId);
  }
  if (params.get('order')) applyOrder(params.get('order'));
  $('selfBtn').addEventListener('click', function () {
    var msg = $('entryMsg');
    if (!sock || !sock.connected) { msg.textContent = 'لا يوجد اتصال بالسيرفر، حاول بعد لحظات'; return; }
    ensureAudio();
    armed = true; btn.classList.add('enabled'); btnText.textContent = 'التنبيه مفعّل';
    sock.emit('self-ticket', function (r) {
      if (r && r.ok) { msg.textContent = ''; applyOrder(r.id); }
      else msg.textContent = 'هذه الخدمة غير متاحة، اطلب رقمك من الكاشير';
    });
  });

  $('entryForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('entryInput').value.trim();
    if (!v) return;
    ensureAudio(); // the tap unlocks sound for the later ring
    armed = true; btn.classList.add('enabled'); btnText.textContent = 'التنبيه مفعّل';
    applyOrder(v);
  });
  var btn = $('alertBtn'), btnText = $('btnText'), conn = $('conn');

  var audioCtx = null, ringTimer = null, vibTimer = null;
  var armed = false, isReady = false, ringing = false;

  /* ---------- Audio ---------- */
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, start, dur) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.6, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }

  // Real bell: a fundamental plus inharmonic partials, each fading at its own speed
  function bell(freq, start, vol) {
    [[1, 1], [2.01, 0.5], [2.76, 0.35], [5.4, 0.18]].forEach(function (p) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq * p[0];
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol * p[1], start + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 1.1 / Math.sqrt(p[0]));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(start); o.stop(start + 1.2);
    });
  }

  function ringOnce() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + 0.02;
    // ring-ring-ring, then a pause (the timer repeats it)
    [0, 0.22, 0.44].forEach(function (d, i) { bell(i === 1 ? 1319 : 1047, t + d, 0.3); });
  }

  function startRinging() {
    if (ringing) return;
    ringing = true;
    ringOnce();
    ringTimer = setInterval(ringOnce, 2200);
    if (navigator.vibrate) {
      var buzz = function () { navigator.vibrate([600, 200, 600, 200, 900]); };
      buzz();
      vibTimer = setInterval(buzz, 2800);
    }
  }

  function stopRinging() {
    ringing = false;
    clearInterval(ringTimer); clearInterval(vibTimer);
    if (navigator.vibrate) navigator.vibrate(0);
  }

  /* ---------- Rating (shown after the customer taps "أنا قادم") ---------- */
  var rateEl = $('rate'), starsEl = $('stars'), rated = false;
  var LABELS = ['', 'سيئة', 'مقبولة', 'جيدة', 'جيدة جداً', 'ممتازة'];

  [].forEach.call(document.querySelectorAll('[data-mark]'), function (img) { img.src = $('brandMark').src; });

  function paintStars(n) {
    [].forEach.call(starsEl.children, function (s, i) {
      s.classList.toggle('on', i < n);
      s.setAttribute('aria-checked', i === n - 1 ? 'true' : 'false');
    });
  }
  function showRate() { if (!rated) rateEl.hidden = false; }

  starsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.star');
    if (!b || rated) return;
    var n = parseInt(b.getAttribute('data-v'), 10);
    rated = true;
    paintStars(n);
    $('rateTitle').textContent = 'شكراً لتقييمك!';
    $('rateSub').textContent = 'نتمنى لك وجبة هنيئة';
    $('rateHint').textContent = LABELS[n];
    $('rateSkip').hidden = true;
    try { localStorage.setItem('ranna_rating_' + orderId, String(n)); } catch (err) {}
    if (sock && sock.connected) sock.emit('order-rating', { orderId: orderId, stars: n });
    setTimeout(function () { rateEl.hidden = true; }, 2400);
  });
  $('rateSkip').addEventListener('click', function () { rateEl.hidden = true; });

  /* ---------- UI state ---------- */
  function setReady() {
    if (isReady) return;
    isReady = true;
    $('step2').classList.remove('current'); $('step2').classList.add('done');
    $('step3').classList.add('done', 'ready');
    $('link1').classList.add('on'); $('link2').classList.add('on');
    var eta = $('eta'); eta.textContent = 'طلبك جاهز، تفضّل بالاستلام'; eta.classList.add('ready');
    btnText.textContent = 'أنا قادم';
    btn.className = 'btn stop';
    document.title = 'طلبك جاهز ✓';
    startRinging();
  }

  btn.addEventListener('click', function () {
    ensureAudio();
    if (ringing) {
      stopRinging();
      $('step3').classList.remove('ready');
      btn.className = 'btn enabled';
      btnText.textContent = 'تم الاستلام';
      showRate();
      return;
    }
    if (!armed) {
      armed = true;
      // short silent-ish blip + tiny vibration so the browser unlocks sound & vibration
      if (audioCtx) tone(1319, audioCtx.currentTime, 0.12);
      if (navigator.vibrate) navigator.vibrate(60);
      btn.classList.add('enabled');
      btnText.textContent = 'التنبيه مفعّل';
      // if the order was already ready before activation
      if (isReady) startRinging();
    }
  });

  /* ---------- Socket.io ---------- */
  window.initSocket = function () {
    if (typeof io === 'undefined') { conn.textContent = 'تعذّر الاتصال بالسيرفر'; return; }
    var socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
    sock = socket;

    socket.on('connect', function () {
      conn.textContent = 'متصل'; conn.classList.add('ok');
      if (orderId) socket.emit('join-order', orderId);
    });
    socket.on('disconnect', function () {
      conn.textContent = 'انقطع الاتصال، جارٍ إعادة المحاولة…'; conn.classList.remove('ok');
    });
    socket.on('connect_error', function () {
      conn.textContent = 'تعذّر الاتصال بالسيرفر'; conn.classList.remove('ok');
    });

    // Ready event sent by the kitchen/server
    socket.on('vibrate-and-sound', function (data) {
      var id = data && (data.orderId || data.order || data.id);
      if (id !== undefined && String(id) !== String(orderId)) return; // another customer's order
      setReady();
    });
  };

  if (typeof io !== 'undefined') window.initSocket();
  else window.addEventListener('load', function () { if (typeof io !== 'undefined') window.initSocket(); });
})();
</script>
<script>
/* Text motion: words rise in when they enter the screen (down or up), and replay when the text changes */
(function () {
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('IntersectionObserver' in window)) { document.documentElement.className = document.documentElement.className.replace(' js', ''); return; }

    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var el = e.target;
        if (e.isIntersecting) { el.classList.remove('above'); el.classList.add('in'); }
        else { el.classList.remove('in'); el.classList.toggle('above', e.boundingClientRect.top < 0); }
      });
    }, { threshold: 0.2 });

    function split(el) {
      var txt = el.textContent.trim();
      if (!txt) return;
      el.textContent = '';
      var sr = document.createElement('span'); sr.className = 'sr'; sr.textContent = txt; el.appendChild(sr);
      var vis = document.createElement('span'); vis.setAttribute('aria-hidden', 'true');
      txt.split(/\s+/).forEach(function (w, i) {
        var s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--i', i); s.textContent = w;
        vis.appendChild(s); vis.appendChild(document.createTextNode(' '));
      });
      el.appendChild(vis);
    }

    function replay(el) {
      el._busy = true; split(el);
      el.classList.remove('in'); void el.offsetWidth;
      requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('in'); el._busy = false; }); });
    }

    var mo = new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        var el = m.target;
        if (el._busy || el.querySelector('.w')) return;
        replay(el);   // the page changed this text (e.g. "طلبك جاهز"): animate it again
      });
    });

    // words
    [].forEach.call(document.querySelectorAll('#restaurantName, .order-label, .step-name, #eta, #btnText, .entry h2, .entry p'), function (el) {
      el.classList.add('tx'); split(el); io.observe(el); mo.observe(el, { childList: true });
    });

    // blocks
    [].forEach.call(document.querySelectorAll('.header, .order-box, .steps'), function (el, i) {
      el.classList.add('rvb'); el.style.setProperty('--d', (i * 0.12) + 's'); io.observe(el);
    });

    // order number: pops when it changes, bounces when tapped
    var num = document.getElementById('orderNumber');
    new MutationObserver(function () { num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); })
      .observe(num, { childList: true, characterData: true, subtree: true });
    num.addEventListener('click', function () { num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump'); });
  } catch (err) {
    document.documentElement.className = document.documentElement.className.replace(' js', '');   // never leave content hidden
  }
})();
</script>
